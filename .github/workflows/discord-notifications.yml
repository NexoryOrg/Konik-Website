name: Discord Notifications

on:
  push:
    branches:
      - main
      - testbereich
  pull_request:
    types: [opened, edited, reopened, closed]
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]

jobs:
  discord_notify:
    runs-on: ubuntu-latest
    steps:

      - name: Build Push Embed
        if: github.event_name == 'push'
        id: build_push
        run: |
          HEAD=$(jq -r '.head_commit' $GITHUB_EVENT_PATH)
          if [ "$HEAD" == "null" ]; then
            echo "No commits in this push."
            echo "embeds=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMMIT_MSG=$(jq -r '.head_commit.message' $GITHUB_EVENT_PATH)
          COMMIT_URL=$(jq -r '.head_commit.url' $GITHUB_EVENT_PATH)
          COMMIT_AUTHOR=$(jq -r '.head_commit.author.username' $GITHUB_EVENT_PATH)
          ADDITIONS=$(jq -r '[.commits[].added[]?] | length' $GITHUB_EVENT_PATH)
          DELETIONS=$(jq -r '[.commits[].removed[]?] | length' $GITHUB_EVENT_PATH)

          REPO=$GITHUB_REPOSITORY
          BRANCH=${GITHUB_REF#refs/heads/}
          
          # Formatiere Dateien mit Emojis
          ADDED_FILES=$(jq -r '[.commits[].added[]? | "✅ " + .] | join("\n")' $GITHUB_EVENT_PATH)
          REMOVED_FILES=$(jq -r '[.commits[].removed[]? | "❌ " + .] | join("\n")' $GITHUB_EVENT_PATH)
          MODIFIED_FILES=$(jq -r '[.commits[].modified[]? | "📝 " + .] | join("\n")' $GITHUB_EVENT_PATH)
          
          FILES_LIST=""
          if [ ! -z "$ADDED_FILES" ] && [ "$ADDED_FILES" != "" ]; then
            FILES_LIST="**Hinzugefügt:**\n$ADDED_FILES\n"
          fi
          if [ ! -z "$MODIFIED_FILES" ] && [ "$MODIFIED_FILES" != "" ]; then
            FILES_LIST="${FILES_LIST}**Bearbeitet:**\n$MODIFIED_FILES\n"
          fi
          if [ ! -z "$REMOVED_FILES" ] && [ "$REMOVED_FILES" != "" ]; then
            FILES_LIST="${FILES_LIST}**Gelöscht:**\n$REMOVED_FILES"
          fi
          
          # Limitiere auf 1024 Zeichen für Discord Field
          if [ ${#FILES_LIST} -gt 1024 ]; then
            FILES_LIST=$(echo -e "$FILES_LIST" | head -10)
            FILES_LIST="${FILES_LIST}... (und mehr)"
          fi
          
          # Escape für JSON
          FILES_LIST=$(printf '%s\n' "$FILES_LIST" | jq -Rs .)
          
          FILES_SUMMARY="✅ $ADDITIONS hinzugefügt | ❌ $DELETIONS gelöscht"

          EMBED=$(jq -n \
            --arg title "Push to $BRANCH" \
            --arg desc "$COMMIT_MSG" \
            --arg url "$COMMIT_URL" \
            --arg author "$COMMIT_AUTHOR" \
            --arg repo "$REPO" \
            --arg files "$FILES_LIST" \
            --arg summary "$FILES_SUMMARY" \
            --argjson additions $ADDITIONS \
            --argjson deletions $DELETIONS \
            --argjson color 3447003 \
            '[
              {
                "title": $title,
                "description": $desc,
                "url": $url,
                "color": $color,
                "author": {
                  "name": $author,
                  "url": ("https://github.com/" + $author),
                  "icon_url": ("https://github.com/" + $author + ".png")
                },
                "fields": [
                  {"name":"Dateien","value": $summary,"inline": false},
                  {"name":"Änderungen","value": $files,"inline": false}
                ],
                "footer":{"text":($repo + " • " + ($additions|tostring) + " additions, " + ($deletions|tostring) + " deletions")}
              }
            ]' | jq -c .)

          echo "embeds=$EMBED" >> $GITHUB_OUTPUT

      - name: Notify Push
        if: github.event_name == 'push'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: ${{ steps.build_push.outputs.embeds }}

      - name: Build Pull Request Embed
        if: github.event_name == 'pull_request'
        id: build_pr
        run: |
          PR_TITLE=$(jq -r '.pull_request.title' $GITHUB_EVENT_PATH)
          PR_URL=$(jq -r '.pull_request.html_url' $GITHUB_EVENT_PATH)
          PR_NUMBER=$(jq -r '.pull_request.number' $GITHUB_EVENT_PATH)
          PR_USER=$(jq -r '.pull_request.user.login' $GITHUB_EVENT_PATH)
          PR_BRANCH=$(jq -r '.pull_request.head.ref' $GITHUB_EVENT_PATH)
          PR_ACTION=$(jq -r '.action' $GITHUB_EVENT_PATH)

          if [[ "$PR_ACTION" == "opened" || "$PR_ACTION" == "reopened" ]]; then
            COLOR=3066993
          elif [[ "$PR_ACTION" == "closed" ]]; then
            COLOR=15158332
          else
            COLOR=9807270
          fi

          EMBED=$(jq -c -n \
            --arg title "Pull Request #$PR_NUMBER" \
            --arg desc "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg user "$PR_USER" \
            --arg branch "$PR_BRANCH" \
            --arg action "$PR_ACTION" \
            --arg repo "$GITHUB_REPOSITORY" \
            --argjson color $COLOR \
            '[
              {
                "title": $title,
                "description": $desc,
                "url": $url,
                "color": $color,
                "author": {
                  "name": $user,
                  "url": ("https://github.com/" + $user),
                  "icon_url": ("https://github.com/" + $user + ".png")
                },
                "fields": [
                  {"name":"Action","value":$action,"inline":true},
                  {"name":"Branch","value":$branch,"inline":true}
                ],
                "footer":{"text":$repo}
              }
            ]')

          echo "embeds=$EMBED" >> $GITHUB_OUTPUT

      - name: Notify Pull Request
        if: github.event_name == 'pull_request'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: ${{ steps.build_pr.outputs.embeds }}

      - name: Build Issue Embed
        if: github.event_name == 'issues'
        id: build_issue
        run: |
          ISSUE_TITLE=$(jq -r '.issue.title' $GITHUB_EVENT_PATH)
          ISSUE_URL=$(jq -r '.issue.html_url' $GITHUB_EVENT_PATH)
          ISSUE_NUMBER=$(jq -r '.issue.number' $GITHUB_EVENT_PATH)
          ISSUE_USER=$(jq -r '.issue.user.login' $GITHUB_EVENT_PATH)
          ISSUE_ACTION=$(jq -r '.action' $GITHUB_EVENT_PATH)

          if [[ "$ISSUE_ACTION" == "opened" || "$ISSUE_ACTION" == "reopened" ]]; then
            COLOR=3066993
          elif [[ "$ISSUE_ACTION" == "closed" ]]; then
            COLOR=15158332
          else
            COLOR=9807270
          fi

          EMBED=$(jq -c -n \
            --arg title "Issue #$ISSUE_NUMBER" \
            --arg desc "$ISSUE_TITLE" \
            --arg url "$ISSUE_URL" \
            --arg user "$ISSUE_USER" \
            --arg action "$ISSUE_ACTION" \
            --arg repo "$GITHUB_REPOSITORY" \
            --argjson color $COLOR \
            '[
              {
                "title": $title,
                "description": $desc,
                "url": $url,
                "color": $color,
                "author": {
                  "name": $user,
                  "url": ("https://github.com/" + $user),
                  "icon_url": ("https://github.com/" + $user + ".png")
                },
                "fields": [{"name":"Action","value":$action,"inline":true}],
                "footer":{"text":$repo}
              }
            ]')

          echo "embeds=$EMBED" >> $GITHUB_OUTPUT

      - name: Notify Issue
        if: github.event_name == 'issues'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: ${{ steps.build_issue.outputs.embeds }}

      - name: Build Issue Comment Embed
        if: github.event_name == 'issue_comment'
        id: build_comment
        run: |
          COMMENT_BODY=$(jq -r '.comment.body' $GITHUB_EVENT_PATH)
          COMMENT_URL=$(jq -r '.comment.html_url' $GITHUB_EVENT_PATH)
          COMMENT_USER=$(jq -r '.comment.user.login' $GITHUB_EVENT_PATH)
          ISSUE_NUMBER=$(jq -r '.issue.number' $GITHUB_EVENT_PATH)

          EMBED=$(jq -c -n \
            --arg title "Comment on Issue #$ISSUE_NUMBER" \
            --arg desc "$COMMENT_BODY" \
            --arg url "$COMMENT_URL" \
            --arg user "$COMMENT_USER" \
            --arg repo "$GITHUB_REPOSITORY" \
            --argjson color 9807270 \
            '[
              {
                "title": $title,
                "description": $desc,
                "url": $url,
                "color": $color,
                "author": {
                  "name": $user,
                  "url": ("https://github.com/" + $user),
                  "icon_url": ("https://github.com/" + $user + ".png")
                },
                "footer":{"text":$repo}
              }
            ]')

          echo "embeds=$EMBED" >> $GITHUB_OUTPUT

      - name: Notify Issue Comment
        if: github.event_name == 'issue_comment'
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: ${{ steps.build_comment.outputs.embeds }}